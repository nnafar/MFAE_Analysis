# ===================================================================
# MFA EXPERIMENT CONFIG
# ===================================================================
# Only the settings that change between experiments live here. Everything
# else comes from config/defaults.yaml (the full, commented reference) and
# from the preset below. To change any other setting, copy it from
# config/defaults.yaml into this file, under the same section name.
#
#   Check this file:     python MFA_analysis.py config_5ms.yaml --check
#   See all settings:    python MFA_analysis.py config_5ms.yaml --show-config

# Experiment type. See config/presets/ for what each one changes.
#   ep    = electroporation, 5 ms pulse, all analyses (defaults unchanged)
#   5ms   = electroporation, 5 ms pulse
#   100us = electroporation, 100 µs pulse
#   asp   = aspiration only, no pulse
preset: 5ms

paths:
  # Folder with this experiment's .tif images.
  data_folder: 'D:\MFAE\5ms_100V\260114_MDAMB231_WT_Chip1_Experiment5-1100Pa-100V-5ms-frame10'
  # Name of the results folder. Follow the naming rule so the bulk analysis
  # recognises it: YYMMDD_Cell_Treatment_Chip_Experiment-1100Pa-100V-5ms-frame10
  experiment_id: '260114_MDAMB231_WT_Chip1_Experiment5-1100Pa-100V-5ms-frame10'

experiment_parameters:
  # Microns per pixel: 10x = 0.629, 20x = 0.315, 40x = 0.158
  scale_factor: 0.315
  # Aspiration pressure [Pa]
  constant_pressure: 1100
  # Seconds between frames; used only if the images have no timing metadata
  frame_interval: 1.75
  max_traps: 18

dye_uptake_parameters:
  # File number of the frame with the pulse
  pulse_frame: 10
  # Text in the file names that identifies each channel
  membrane_channel_pattern: 'C1'
  dye_channel_pattern: 'C2'

actin_parameters:
  enable: True
  channel_pattern: 'C1'

workflow_settings:
  # CPU cores to use; lower it if the computer becomes slow
  n_workers: 3

# ===================================================================
# MFA EXPERIMENT CONFIG
# ===================================================================
# The settings for one experiment. Everything not listed here comes from
# config/defaults.yaml (the full, commented reference). To change any other
# setting for this experiment, copy it from there into this file under the
# same section name.
#
# Start a new experiment by copying a config, with the paths filled in:
#   python MFA_analysis.py --init-config my_exp.yaml --data-folder "D:/MFAE/<folder>"
#   (add  --from config_asp.yaml  to copy a different config)
#
# Check a config:      python MFA_analysis.py <this file> --check
# See all settings:    python MFA_analysis.py <this file> --show-config

paths:
  # Folder with this experiment's .tif images.
  data_folder: 'D:\MFAE\5ms_100V\260114_MDAMB231_WT_Chip1_Experiment5-1100Pa-100V-5ms-frame10'
  # Name of the results folder. The pulse voltage, duration and frame are read
  # from it, so follow the naming rule:
  #   YYMMDD_Cell_Treatment_Chip_Experiment-<P>Pa-<V>V-<D>ms-frame<N>
  #   e.g. 260128_MDAMB231_WT_Chip1_Experiment3-1100Pa-100V-1ms-frame10
  experiment_id: '260114_MDAMB231_WT_Chip1_Experiment5-1100Pa-100V-5ms-frame10'

experiment_parameters:
  # Microns per pixel: 10x = 0.629, 20x = 0.315, 40x = 0.158
  scale_factor: 0.315
  # Aspiration pressure [Pa] = (P_inlet - P_waste_outlet) x 0.55
  # (factor from Jessy's COMSOL simulation)
  constant_pressure: 1100
  # Seconds between frames; used only if the images have no timing metadata
  frame_interval: 1.75
  max_traps: 18

# Which analyses to run (True / False). The membrane channel is always analysed.
# Whether there was a pulse is read from the experiment name (0V = no pulse).
dye_uptake_parameters:
  enable: True
  # Text in the file names that identifies each channel
  membrane_channel_pattern: 'C1'
  dye_channel_pattern: 'C2'

actin_parameters:
  enable: True
  channel_pattern: 'C1'

workflow_settings:
  # CPU cores to use; lower it if the computer becomes slow
  n_workers: 3
  # Show an early frame during setup
  selection_frame_fraction: 0.1

# ===================================================================
# MFA CONFIG: aspiration only, no pulse (.tif folders)
# ===================================================================
# Analyse every experiment in the folder(s) listed under data_folder below
# (searched at any depth for folders of .tif images):
#   python run_experiment.py config/config_aspiration_tiff.yaml --batch
# Experiments that need other settings go in another config with their own
# folders, run the same way. Results go to Output/Aspiration/<experiment>/;
# already analysed experiments are skipped when you run it again.
# In a batch run, experiment_type (ep / asp) and the pulse are read from each
# experiment's name (0V = aspiration only).
#
# One experiment only:
#   python run_experiment.py config/config_aspiration_tiff.yaml --data-folder "<one experiment folder>" --output-dir Output/Aspiration
#
# Check a config:      python run_experiment.py <this file> --batch --check
# See all settings:    python run_experiment.py <this file> --data-folder "<one experiment folder>" --show-config

# ep  = electroporation (pulse voltage, duration and frame are read from the
#       experiment name, e.g. ...-100V-1ms-frame10)
# asp = aspiration only (experiment name has 0V)
experiment_type: asp

# -------------------------------------------------------------------
# EXPERIMENT
# -------------------------------------------------------------------
paths:
  # 'tiff' = a folder of exported .tif files, 'czi' = a Zeiss .czi file
  # (to analyse .czi files, start from config/config_czi.yaml)
  image_format: tiff
  # Folder(s) to search for experiments (--batch); a list ('- ...' lines) or one folder.
  data_folder: 'M:\tnw\bn\gk\NN\2_Data-Analysis\MFAE\Aspiration'
  # One experiment (no --batch): name of the results folder; must follow the naming rule:
  #   YYMMDD_Cell_Treatment_Chip_Experiment-<P>Pa-<V>V-<D>ms-frame<N>
  #   e.g. 260128_MDAMB231_WT_Chip1_Experiment3-1100Pa-100V-1ms-frame10
  experiment_id: '260325_MDAMB231_CytD_Chip1_Experiment272-1100Pa-0V-0ms-frame0'

experiment_parameters:
  # Microns per pixel: 10x = 0.629, 20x = 0.315, 40x = 0.158
  scale_factor: 0.315
  # Aspiration pressure [Pa] = (P_inlet - P_waste_outlet) x 0.55
  # (factor from Jessy's COMSOL simulation)
  constant_pressure: 1100
  # Seconds between frames; used only if the images have no timing metadata
  frame_interval: 1.72
  # Maximum number of traps to set up
  max_traps: 18

# -------------------------------------------------------------------
# ANALYSES (True / False) AND CHANNELS
# -------------------------------------------------------------------
# The membrane channel is always analysed (protrusion length and shape).
dye_uptake_parameters:
  enable: True
  # Text in the file names that identifies each channel (C1, C2 as exported)
  membrane_channel_pattern: 'C1'
  dye_channel_pattern: 'C2'

actin_parameters:
  enable: True
  channel_pattern: 'C1'

rupture_detection:
  # Rupture / dead-on-arrival detection (a heuristic; results are hints)
  enable: False
  # 3-frame rolling median on the protrusion length trace
  enable_smoothing: True
  # Remove outlier length points before viscoelastic fitting
  enable_outlier_rejection: True

model_parameters:
  # Viscoelastic fitting (skipped automatically for pulsed experiments)
  perform_fitting: False

workflow_settings:
  # Membrane kymographs (CSV + multipanel figure)
  create_kymographs: True

  # ---------------------------------------------------------------
  # INTERACTIVE SETUP
  # ---------------------------------------------------------------
  # Frame shown during setup, as a fraction of the recording (0.5 = middle)
  selection_frame_fraction: 0.3
  # Starting size of the trap box [µm]; adjust it during setup as needed
  default_roi_width_um: 115.0
  default_roi_height_um: 45.0

  # ---------------------------------------------------------------
  # COMPUTER
  # ---------------------------------------------------------------
  # CPU cores to use; lower it if the computer becomes slow
  n_workers: 3

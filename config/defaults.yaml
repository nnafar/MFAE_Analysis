# ===================================================================
# MFA PIPELINE: ADVANCED SETTINGS (for developers)
# ===================================================================
# Algorithm settings that stay the same between experiments, with the lab's
# tuned values. Users don't need to read or edit this file.
#
# This file and the user configs (e.g. config/config_tiff_template.yaml) never share a setting, so
# either can be rewritten without affecting the other:
#   - user settings live ONLY in the user configs (each must set all of them),
#   - the settings here can NOT be changed from a user config.
# The pipeline refuses to start if either rule is broken. The user settings
# (USER_KEYS in mfae/config/loader.py) are:
#     experiment_type        ep / asp
#     paths                  data_folder, experiment_id
#     experiment_parameters  scale_factor, constant_pressure, frame_interval, max_traps
#     dye_uptake_parameters  enable, membrane_channel_pattern, dye_channel_pattern
#     actin_parameters       enable, channel_pattern
#     rupture_detection      enable, enable_smoothing, enable_outlier_rejection
#     model_parameters       perform_fitting
#     workflow_settings      create_kymographs, n_workers, selection_frame_fraction,
#                            default_roi_width_um, default_roi_height_um
# The pulse voltage, duration and frame are read from the experiment name.
#
# Changing a value HERE changes it for every experiment.
#
# Each run saves the complete combined settings to
#     Output/<experiment_id>/effective_config.yaml
# and you can print them with:  python run_experiment.py my.yaml --show-config

# ===================================================================
# 1. DYE UPTAKE & ACTIN
# ===================================================================
dye_uptake_parameters:
  baseline_frames: 5           # Frames before the pulse used as dye baseline.

actin_parameters:
  cortex_thickness_px: 3       # Cortex shell depth (3 px ≈ 1.9 µm at 60x).
  cortex_cv_threshold: 0.4     # Below = continuous cortex, above = patchy.
  pre_pulse_window_frames: 5   # Frames before the pulse for the remodelling score.
  post_pulse_window_frames: 10 # Frames after the pulse for the remodelling score.

# ===================================================================
# 2. DEVICE GEOMETRY & VISCOELASTIC FITTING
# ===================================================================
# Whether fitting runs is a user setting (model_parameters.perform_fitting).
model_parameters:
  # Channel cross-section (from the mask design or SEM).
  channel_width_um: 6.7        # [µm]
  channel_height_um: 5.0       # [µm]
  channel_length_um: 40.0      # [µm]

  # Son (2007) shape factor for non-circular channels; "auto" computes it.
  fstar: auto

  # Viscosity of the medium (for shear stress and shear rate).
  fluid_viscosity_pa_s: 1e-3   # [Pa·s]

fitting_parameters:
  # True = multi-start global search (slow, robust); False = local fit (fast).
  use_global_optimization: False
  jeffreys_maxfev: 50000       # Max evaluations, viscoelastic models.
  empirical_maxfev: 5000       # Max evaluations, empirical models.

  # Starting guess: [E, eta1, eta2]
  default_initial_guess: [3000.0, 5000.0, 15000.0]

  # Allowed parameter ranges for the fit.
  fitting_bounds:
    E: [100.0, 100000.0]       # [Pa]
    eta1: [100.0, 500000.0]    # [Pa·s]
    eta2: [500.0, 1000000.0]   # [Pa·s]

  # Ranges for the automatic initial guess.
  clipping_bounds_guess:
    E: [500.0, 25000.0]        # [Pa]
    eta1: [1000.0, 50000.0]    # [Pa·s]
    eta2: [5000.0, 100000.0]   # [Pa·s]

# ===================================================================
# 3. CELL ENTRY, EXIT & RUPTURE DETECTION
# ===================================================================
# Rupture/DOA detection is switched on or off in each experiment config
# (rupture_detection.enable). These are the tuned detector values used when on.
rupture_detection:
  # --- Monitoring window (inside the pipette, ahead of the cell tip) ---
  rupture_offset_from_tip_px: 7      # Gap between tip and window [px]
  rupture_window_width_px: 5         # Window width [px]

  # --- Cell entry ---
  entry_protrusion_threshold_um: 5.0 # Protrusion length that marks entry
  entry_max_prot_fraction: 0.9       # Longer than channel_length * this = clamped/debris
  entry_body_area_min_um2: 10.0      # Minimum body area (noise floor only)
  entry_confirmed_frames: 3          # Consecutive valid frames needed to confirm entry

  # --- Cell exit ---
  exit_protrusion_threshold_um: 0.5  # Length below which the cell has left
  exit_drop_ratio: 0.05              # Length below this fraction of the previous frame = slip
  exit_sustained_frames: 3           # Consecutive frames the drop must last
  cell_change_drop_ratio: 0.5         # Length drops below half its recent level and stays = the cell left / a new one came (0 = off)
  exit_at_roi_edge_frames: 3         # Stop tracking once the tip stays at the left ROI edge this many frames (0 = off)
  roi_edge_margin_px: 3              # Tip within this many px of the edge counts as at the edge
  pulse_exit_blanking_frames: 5      # Frames after the pulse ignored for exit detection

  # --- Dead-on-arrival (DOA) check ---
  # A cell is DOA if, at entry, it fails to displace the fluid AND its body
  # outline is fragmented.
  doa_retention_ratio: 0.80          # Entry signal >= this x empty-trap baseline
  doa_solidity_threshold: 0.85       # Body solidity below this = fragmented

  # --- Baseline for the detectors below ---
  cusum_settling_buffer: 3           # Frames skipped after entry
  min_cusum_baseline_frames: 5       # Frames in the rolling baseline
  cusum_baseline_lag: 2              # Gap between baseline and tested frame
  min_intensity_noise_floor: 1.0     # Smallest noise sigma assumed
  max_baseline_sigma: 1.0            # Largest noise sigma allowed (entry noise cap)

  # --- 1. Spike: transient burst ---
  enable_spike_check: True
  spike_sigma_threshold: 3.5         # Lower = more sensitive

  # --- 2. Step: fast leak ---
  enable_step_check: True
  step_sigma_threshold: 4.0

  # --- 3. Sudden jump: frame-to-frame haze increase ---
  sudden_jump_threshold: 1.0         # [a.u.]

  # --- 4. CUSUM: slow drift ---
  min_drift_tolerance: 3.0           # Smallest drift that counts [a.u.]
  min_cusum_threshold: 5.0           # Smallest alarm level [a.u.]
  cusum_drift_tolerance_factor: 0.5  # k, in noise sigmas
  cusum_threshold_factor: 8.0        # h, in noise sigmas

  # --- 5. Anchored rise: slow leak vs. the early-entry baseline ---
  anchored_baseline_frames: 5
  anchored_fold_threshold: 2.5       # Rise of at least 2.5x ...
  anchored_abs_threshold: 3.0        # ... and at least 3 a.u.
  anchored_scan_window: 7            # ... sustained over this many frames

  # --- 6. Pulse context: haze rise right after the pulse (pulsed runs only) ---
  pulse_context_pre_window: 5        # Frames before the pulse (baseline)
  pulse_context_post_window: 5       # Frames after the pulse (sustained rise)
  pulse_context_peak_window: 2       # Frames after the pulse (transient peak)
  pulse_context_fold_threshold: 1.3  # Post/pre ratio needed
  pulse_context_abs_threshold: 0.5   # And minimum absolute rise [a.u.]

  # --- Length-drop veto ---
  # A real rupture loses volume, so the protrusion must get shorter; candidates
  # where it doesn't are removed (e.g. slow dye uptake in an intact cell).
  # DOA and pulse-context candidates are never vetoed.
  enable_length_veto: True
  length_veto_window: 10             # Frames each side of the candidate
  rupture_length_drop_ratio: 0.90    # Post/pre length below this = real rupture

  # Haze rises big enough to skip the veto (pressure can keep a ruptured
  # protrusion extended). Fold AND absolute thresholds must both be met.
  veto_bypass_fold_threshold: 2.0    # vs. the 5 frames before the candidate
  veto_bypass_abs_threshold: 5.0
  veto_global_bypass_fold_threshold: 1.7  # vs. the early-entry baseline
  veto_global_bypass_abs_threshold: 3.0

  # --- Protrusion-length cleaning ---
  # (enable_smoothing and enable_outlier_rejection are set per experiment.)
  # The following only affect viscoelastic fitting:
  exclude_early_fraction: 0.03
  outlier_rejection_window: 11       # Odd number of frames
  outlier_rejection_std_dev: 2.5

# ===================================================================
# 4. WORKFLOW & PERFORMANCE
# ===================================================================
workflow_settings:
  verify_traps_interactively: True
  debug_mode: True                   # Detailed messages in the log file

  max_cache_size: 25                 # Frames kept in memory during setup

  # Trap spacing as a multiple of the trap height (adjustable during setup).
  trap_spacing_factor: 1.50

  # Setup windows.
  interactive_window_width: 1000
  interactive_window_height: 800
  window_scale_factor: 1.0           # Raise (1.5-2.0) on high-resolution screens

  # Tracking movies (1_Protrusion_and_Shape/Movies/Trap_XX_tracking.avi):
  # membrane image with the masks, tracked tip and length trace per frame.
  save_tracking_movies: True
  tracking_movie_fps: 10
  tracking_movie_width_px: 900       # Approximate video width; the trap image is enlarged by a whole factor
  # (Trap-box size and the setup frame are set per experiment.)

# ===================================================================
# 5. FIGURES
# ===================================================================
plotting_parameters:
  # Per-trap plots are saved as multipanel PDFs (one per plot type, every trap a panel).
  multipanel_columns: 4              # Trap panels per row
  save_individual_trap_plots: False  # True = also one PDF per trap per plot

kymograph_parameters:
  default_line_width_px: 10          # Thickness of the centre-line slice [px]

# ===================================================================
# 6. IMAGE PROCESSING (change only if segmentation fails)
# ===================================================================
image_processing:
  min_area_threshold: 100            # Smallest object tracked [px²]
  small_object_threshold: 50         # Objects smaller than this are removed [px²]
  wall_clip_margin: 0.25             # Fraction of the ROI height ignored at top and bottom
  clahe_clip_limit: 3.0              # Contrast enhancement strength
  clahe_tile_grid_size: [16, 16]
  gaussian_kernel_size: [5, 5]       # Blur before thresholding

  # Passing-cell rejection: a body blob counts as the trapped cell only if its
  # left edge is within this many pixels of the pipette entrance.
  max_body_entrance_gap_px: 8

  # Show the threshold histogram on the contrast-enhanced image (what the
  # algorithm actually thresholds).
  threshold_preview_clahe: True

  # Membrane-channel enhancement (used for the protrusion/body masks only).
  # The membrane image is denoised and converted to signal-to-noise units
  # relative to the background, re-estimated in every frame, so a threshold
  # means the same thing in every frame regardless of bleaching or a bright
  # protrusion tip. Actin and dye intensities are always read from the raw
  # pixels; only the masks come from this enhanced image.
  # Set membrane_enhancement: False to go back to the CLAHE settings above.
  membrane_enhancement: True
  membrane_denoise_sigma: 1.0        # Smoothing across the channel (y) [px]
  membrane_denoise_sigma_along: 1.0  # Smoothing along the channel (x) [px]. Normally chosen per trap
                                     # in the threshold window (auto from cell brightness, F to change);
                                     # this value is only used when no per-trap choice exists.
  membrane_temporal_window: 3        # Masks from the median of 3 consecutive frames (1 = off); steadier tips
  membrane_snr_full_scale: 40.0      # SNR shown as 255 (minimum): raised per trap in the threshold window when
                                     # the cell is brighter, so a bright cell and the medium do not both clip
  protrusion_leak_fraction: 0.4      # Mask running to the box edge: cut where signal is < 40 % of the protrusion's (0 = off)
  max_tip_refinement_px: 15.0        # Tip refinement farther than this beyond the mask edge is ignored [px]
  tip_level_fraction: 0.25           # Tip = where the centre-line profile drops to bg + this x (protrusion - bg); lower follows dimmer tips
  membrane_fill_holes: True          # Fill the interior of ring-shaped membrane stains
  membrane_max_hole_fraction: 0.25   # Do not fill holes larger than this fraction of the ROI
  membrane_relative_level: 0.3       # Mask pixels must also reach this fraction of the local cell signal; drops the halo around bright cells (0 = off)

# ===================================================================
# 7. GUV MODE (giant unilamellar vesicles instead of cells)
# ===================================================================
guv_settings:
  enable: False
  selection_frame_index: 1           # Early frame where the membrane is still intact
  # Edge-detector sensitivity: 0.2-0.3 strong edges only, 0.5-0.6 faint membranes.
  canny_sigma: 0.4

# ===================================================================
# MFA SETUP CONFIG: symmetric E-field (Zeiss .czi files)
# ===================================================================
# Settings for every experiment recorded on this setup. Run them all at once
# (finds every .czi file under data_folder, at any depth):
#   python run_experiment.py config/config_symmetric_czi.yaml --batch
# Results go to Output/Symmetric_Efield/<experiment>/, so this setup is never pooled
# with another one; run_bulk_analysis.py also analyses it on its own, with the
# aspiration-only experiments (Output/Aspiration, config_aspiration_tiff.yaml)
# as its no-pulse controls.
# In a batch run, experiment_type (ep / asp) and the pulse are read from each
# experiment's name (0V = aspiration only).
#
# One experiment only:
#   python run_experiment.py config/config_symmetric_czi.yaml --data-folder "<one .czi file>" --output-dir Output/Symmetric_Efield
#
# Check a config:      python run_experiment.py <this file> --check
# See all settings:    python run_experiment.py <this file> --show-config

# ep  = electroporation (pulse voltage, duration and frame are read from the
#       experiment name, e.g. ...-100V-1ms-frame10)
# asp = aspiration only (experiment name has 0V)
experiment_type: ep

# -------------------------------------------------------------------
# EXPERIMENT
# -------------------------------------------------------------------
paths:
  # 'tiff' = a folder of exported .tif files, 'czi' = a Zeiss .czi file
  image_format: czi
  # The .czi file, or the folder holding it: in a folder with several .czi files,
  # the one named after experiment_id is used.
  data_folder: 'M:\tnw\bn\gk\NN\2_Data-Analysis\MFAE\Symmetric_Efield'
  # Name of the results folder (defaults to the .czi file name); must follow the naming rule:
  #   YYMMDD_Cell_Treatment_Chip_Experiment-<P>Pa-<V>V-<D>ms-frame<N>
  #   e.g. 260128_MDAMB231_WT_Chip1_Experiment3-1100Pa-100V-1ms-frame10
  experiment_id: '261119_MDAMB231_LifeAct_Chip1_Experiment2-1100Pa-100V-1ms-frame304'

experiment_parameters:
  # Microns per pixel: 
  #   COLIBRI: 10x = 0.629, 20x = 0.315, 40x = 0.158; 
  #   ANDOR: 20x = 0.512
  scale_factor: 0.512
  # Based on COMSOL simulations, the pressure in the trap is ~1.9 kPa when filled.
  constant_pressure: 1900
  # Seconds between frames; used only if the images have no timing metadata
  frame_interval: 2.95
  # Maximum number of traps to set up
  max_traps: 15

# -------------------------------------------------------------------
# ANALYSES (True / False) AND CHANNELS
# -------------------------------------------------------------------
# The membrane channel is always analysed (protrusion length and shape).
dye_uptake_parameters:
  enable: True
  # Channel numbers in the .czi file, counted from 1 as Fiji shows them
  membrane_channel_number: 2
  dye_channel_number: 1

actin_parameters:
  enable: True
  channel_number: 2

rupture_detection:
  # Rupture / dead-on-arrival detection (a heuristic; results are hints)
  enable: False
  # 3-frame rolling median on the protrusion length trace
  enable_smoothing: False
  # Remove outlier length points before viscoelastic fitting
  enable_outlier_rejection: False

model_parameters:
  # Viscoelastic fitting (skipped automatically for pulsed experiments)
  perform_fitting: False

workflow_settings:
  # Membrane kymographs (CSV + multipanel figure)
  create_kymographs: True

  # ---------------------------------------------------------------
  # INTERACTIVE SETUP
  # ---------------------------------------------------------------
  # Frame shown during setup, as a fraction of the recording (0.5 = middle)
  selection_frame_fraction: 0.3
  # Starting size of the trap box [µm]; adjust it during setup as needed
  default_roi_width_um: 68.0
  default_roi_height_um: 27.0

  # ---------------------------------------------------------------
  # COMPUTER
  # ---------------------------------------------------------------
  # CPU cores to use; lower it if the computer becomes slow
  n_workers: 3

# ===================================================================
# MFA CONFIG: symmetric microscope (Zeiss .czi): symmetric E-field
# ===================================================================
# Settings of the symmetric microscope: Zeiss .czi files, 0.512 um/px, 1900 Pa,
# channel 2 = membrane, channel 1 = dye.
# Asymmetric microscope (.tif): config/config_asymmetric.yaml.
# For a new setup, copy a template: see config/pipeline/.
#
# Analyse every experiment in the folders listed under data_folder below
# (searched at any depth for .czi files):
#   python run_experiment.py config/config_symmetric.yaml --batch
# Each listed folder gets its own results folder (Output/Symmetric_Efield/).
# Already analysed experiments are skipped when you run it again (--redo
# analyses them again). Pulsed or aspiration-only (ep / asp) and the pulse
# frame are read from each experiment's name (0V = aspiration only).
#
# Only some experiments / traps:
#   ... --batch --only Experiment2               experiments whose name contains the text
#   ... --batch --only Experiment2 --traps 7     redo the setup of trap 7 only
# One experiment (results go to the same place as in the batch):
#   python run_experiment.py config/config_symmetric.yaml --data-folder "<one .czi file>"
#
# Check a config:      python run_experiment.py <this file> --batch --check
# See all settings:    python run_experiment.py <this file> --data-folder "<one .czi file>" --show-config

# Only used when the experiment name can't be read (batch runs and folder
# lists take it from the name): ep = electroporation, asp = aspiration only
experiment_type: ep

# -------------------------------------------------------------------
# EXPERIMENT
# -------------------------------------------------------------------
paths:
  # 'tiff' = a folder of exported .tif files, 'czi' = a Zeiss .czi file
  image_format: czi
  # Folder(s) to search for experiments (--batch); a list ('- ...' lines) or one folder.
  data_folder:
    - 'E:\Data\MFAE\Symmetric_Efield'
    # - 'E:\Data\MFAE_Symmetric'   (add more folders like this; '#' switches a line off)
  # Example experiment name (only used when no file is given); names must follow:
  #   YYMMDD_Cell_Treatment_Chip_Experiment-<P>Pa-<V>V-<D>ms-frame<N>
  #   e.g. 260128_MDAMB231_WT_Chip1_Experiment3-1100Pa-100V-1ms-frame10
  experiment_id: '261119_MDAMB231_LifeAct_Chip1_Experiment2-1100Pa-100V-1ms-frame304'

experiment_parameters:
  # Microns per pixel: 
  #   COLIBRI: 10x = 0.629, 20x = 0.315, 40x = 0.158; 
  #   ANDOR: 20x = 0.512
  scale_factor: 0.512
  # Based on COMSOL simulations, the pressure in the trap is ~1.9 kPa when filled.
  constant_pressure: 1900
  # Seconds between frames; used only if the images have no timing metadata
  frame_interval: 2.95
  # Maximum number of traps to set up
  max_traps: 15

# -------------------------------------------------------------------
# ANALYSES (True / False) AND CHANNELS
# -------------------------------------------------------------------
# The membrane channel is always analysed (protrusion length and shape).
dye_uptake_parameters:
  enable: True
  # Channel numbers in the .czi file, counted from 1 as Fiji shows them
  membrane_channel_number: 2
  dye_channel_number: 1

actin_parameters:
  enable: True
  channel_number: 2

rupture_detection:
  # Rupture / dead-on-arrival detection (a heuristic; results are hints)
  enable: False
  # 3-frame rolling median on the protrusion length trace
  enable_smoothing: False
  # Remove outlier length points before viscoelastic fitting
  enable_outlier_rejection: False

model_parameters:
  # Viscoelastic fitting (skipped automatically for pulsed experiments)
  perform_fitting: False

workflow_settings:
  # Membrane kymographs (CSV + multipanel figure)
  create_kymographs: True

  # ---------------------------------------------------------------
  # INTERACTIVE SETUP
  # ---------------------------------------------------------------
  # Frame shown during setup, as a fraction of the recording (0.5 = middle)
  # A later frame (0.4) shows the protrusion after some bleaching, so the
  # threshold picked there still holds at the end of the recording.
  selection_frame_fraction: 0.4
  # Starting size of the trap box [µm]; adjust it during setup as needed
  default_roi_width_um: 68.0
  default_roi_height_um: 27.0

  # ---------------------------------------------------------------
  # COMPUTER
  # ---------------------------------------------------------------
  # CPU cores to use; lower it if the computer becomes slow
  n_workers: 3

# ===================================================================
# MFA EXPERIMENT CONFIG
# ===================================================================
# Only the settings that change between experiments live here. Everything
# else comes from config/defaults.yaml (the full, commented reference) and
# from the preset below. To change any other setting, copy it from
# config/defaults.yaml into this file, under the same section name.
#
#   Check this file:     python MFA_analysis.py config_asp.yaml --check
#   See all settings:    python MFA_analysis.py config_asp.yaml --show-config

# Experiment type:
#   ep  = electroporation (any voltage / pulse duration)
#   asp = aspiration only (0 V)
preset: asp

paths:
  # Folder with this experiment's .tif images.
  data_folder: 'D:\MFAE\0ms_0V\260326_MDAMB231_WT_Chip2_Experiment283-1100Pa-0V-0ms-frame0'
  # Name of the results folder. The pulse voltage, duration and frame are read
  # from it, so follow the naming rule:
  #   YYMMDD_Cell_Treatment_Chip_Experiment-<P>Pa-<V>V-<D>ms-frame<N>
  #   e.g. 260128_MDAMB231_WT_Chip1_Experiment3-1100Pa-100V-1ms-frame10
  experiment_id: '260326_MDAMB231_WT_Chip2_Experiment283-1100Pa-0V-0ms-frame0'

experiment_parameters:
  # Microns per pixel: 10x = 0.629, 20x = 0.315, 40x = 0.158
  scale_factor: 0.315
  # Aspiration pressure [Pa]
  constant_pressure: 1100
  # Seconds between frames; used only if the images have no timing metadata
  frame_interval: 1.72
  max_traps: 18

# Which analyses to run (True / False). The membrane channel is always analysed.
dye_uptake_parameters:
  enable: True
  # Text in the file names that identifies each channel
  membrane_channel_pattern: 'C1'
  dye_channel_pattern: 'C2'

actin_parameters:
  enable: True
  channel_pattern: 'C1'

workflow_settings:
  # CPU cores to use; lower it if the computer becomes slow
  n_workers: 3

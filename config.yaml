# ===================================================================
# CONFIGURATION FOR MICROFLUIDIC ASPIRATION (MFA) PIPELINE
# ===================================================================
# INSTRUCTIONS:
# This file controls your experiment settings.
# 1. Update Section 1 & 2 for every new experiment.
# 2. Adjust Section 4 & 5 only if the analysis is failing or slow.

# ===================================================================
# --- 1. FILE LOCATIONS ---
# ===================================================================
# Tell the code where to find your data and where to save results.
paths:
  # Folder containing your raw image sequence (.tif/.tiff)

  data_folder: "W:\\staff-groups\\tnw\\bn\\gk\\NN\\2_Data-Analysis\\MFAE\\260130_Experiment463-100V-100us-frame10"


  # Name for this analysis run. New output folders will be created with this name.
  experiment_id: "260130_Experiment463-100V-100us-frame10-actin"


# ===================================================================
# --- 2. MICROSCOPE & EXPERIMENT SETUP ---
# ===================================================================
# These MUST match your physical equipment settings.
experiment_parameters:
  # Microscope Resolution: How many microns is one pixel? (Check your objective lens specs).
  scale_factor: 0.629      # [µm/pixel]
  
  # The pressure difference driving the cell into the pipette.
  constant_pressure: 1100  # [Pascals]
  
  # Time between frames. (Used as a backup if image metadata is missing).
  frame_interval: 1.7      # [Seconds]
  
  # Maximum number of traps to process (prevents infinite loops if detection fails)
  max_traps: 18            

# ===================================================================
# --- 3. PHYSICS MODEL ---
# ===================================================================

# Controls how we calculate stiffness and viscosity from the cell protrusion length.
model_parameters:
  # Main Switch: Set to True to calculate Viscoelasticity. Set False for raw length data only.
  perform_fitting: True 

  # Physical dimensions of the microfluidic channel (measured from mask or SEM)
  channel_width_um: 6.7    # [µm]
  channel_height_um: 5.0   # [µm]
  channel_length_um: 40.0  # [µm]

  # Shape Correction: Adjusts math for non-circular pipettes.
  # Leave as "auto" to let the code calculate it using Son (2007) formulas.
  fstar: auto

  # Viscosity of the fluid surrounding the cell (used to calculate shear stress and rate)
  fluid_viscosity_pa_s: 1e-3 # [Pa·s]

# ===================================================================
# --- 4. RUPTURE DETECTION (INTENSITY ANALYSIS) ---
# ===================================================================
# Settings for identifying when the cell membrane breaks (bursts).
# NOTE: This pipeline uses "Haze Detection" (intensity changes inside the pipette)
# rather than length drops, making it safe for electroporation (retraction) experiments.

rupture_detection:
  # Main Switch: Set to True to enable rupture check. Set False for raw data only.
  enable: True
  
  # --- SPATIAL MONITORING ("The Eyes") ---
  # Where to look inside the pipette (ahead of the cell tip)
  rupture_offset_from_tip_px: 10     # Gap between cell tip and box [pixels]
  rupture_window_width_px: 5        # Width of the monitoring box [pixels]
  
  # --- TIMING ---
  entry_velocity_threshold_px: 2.0  # Speed to mark "Time 0" (Cell Entry)
  cusum_settling_buffer: 0        # [Was 3] Start immediately after entry
  cusum_baseline_len: 5           # Keep at 5 for good statistics
  cusum_baseline_lag: 2           # [Was 3] 2 frames (3.4s) is enough to skip the ramp

  # --- ALGORITHM TUNING (MULTI-MODE) ---
  
  # 1. SPIKE DETECTION (Transient Bursts)
  #    Formula: Signal > (Mean + Sigma * Threshold)
  enable_spike_check: True
  spike_sigma_threshold: 3.5        # Sensitivity: Lower (3.0) = More sensitive, Higher (6.0) = Safer

  # 2. STEP DETECTION (Fast Leaks)
  #    Faster reaction time than CUSUM for catastrophic failure.
  enable_step_check: True
  step_sigma_threshold: 4.0         # Sensitivity: Needs a distinct jump to trigger.

  # 3. DRIFT DETECTION (CUSUM - Slow Leaks)
  min_intensity_noise_floor: 1.0    # Minimum assumed noise (prevents div/0 errors on clean images)
  min_drift_tolerance: 3.0          # Minimum change to register as drift (0.1 = very sensitive)
  min_cusum_threshold: 5.0          # Accumulation threshold to trigger alarm
  
  cusum_drift_tolerance_factor: 0.5 # (k) Multiplier for noise sigma
  cusum_threshold_factor: 8.0       # (h) Multiplier for noise sigma to trigger

  # --- DATA CLEANING ---
  exclude_early_fraction: 0.03

  # Slip/Retraction Handling (Physics logic only, NOT used for rupture)
  drop_threshold: 0.4               
  absolute_threshold: 1.0           
  window_size: 15                   

  # Outlier Removal
  enable_outlier_rejection: False
  enable_smoothing: False           
  outlier_rejection_window: 11      
  outlier_rejection_std_dev: 2.5

# ===================================================================
# --- 5. AUTOMATION & PERFORMANCE ---
# ===================================================================

workflow_settings:
  # Human Check:
  # True = Pop up a window to confirm every trap location (Recommended for first run).
  # False = Run fully automatic (Batch mode).
  verify_traps_interactively: True

  # Debugging: Save extra logs and images if something goes wrong.
  debug_mode: True                  # Enables verbose logging for troubleshooting
  create_kymographs: True           # Generate Space-Time plots for every trap?

  # Speed: Number of CPU cores to use.
  # Recommendation: Set to (Total Cores - 1) or (Total Cores / 2) to prevent system lag.
  n_workers: 5    
  
  # Memory: How many frames to keep in RAM (lowering this saves memory but slows processing).               
  max_cache_size: 50
  
  # Auto-Detection: How far apart are your traps? (1.5 = 1.5x the height of a trap).
  trap_spacing_factor: 1.50

  # Interface: Size of the pop-up windows.
  interactive_window_width: 1000
  interactive_window_height: 800
  
  # High-DPI Scaling: Increase this (e.g., 1.5 or 2.0) if windows look tiny on screens.
  window_scale_factor: 1.0

  # ROI Defaults: Starting guess for box size if detection fails.
  default_roi_width_um: 115.0       # [µm]
  default_roi_height_um: 45.0       # [µm]
  
  # Setup Screen: Which part of the video to show during setup? (0.5 = Middle of video).
  selection_frame_fraction: 0.5

# ===================================================================
# --- 6. DYE UPTAKE ANALYSIS (ELECTROPORATION) ---
# ===================================================================
dye_uptake_parameters:
  enable: True
  
  # File Naming: Strings used to identify which image is which channel.
  membrane_channel_pattern: "C1"    # e.g., Membrane label
  dye_channel_pattern: "C2"         # e.g., Fluorescence / TRITC/ PI dye
  
  # Timing: When did you shock the cell?
  pulse_frame: 10                   # The exact frame number of the electric pulse.
  baseline_frames: 5                # How many frames before the pulse to check for background signal.

# ===================================================================
# --- 7. ACTIN QUANTIFICATION ---
# ===================================================================
actin_parameters:
  enable: True                      # Set to True to enable, False to skip
  channel_pattern: "C3"             # Substring to identify actin images

# ===================================================================
# ADVANCED / DEVELOPER PARAMETERS
# ===================================================================
# Modify these only if the image processing or fitting is failing.

image_processing:
  wall_clip_margin: 0.30           # Ignore top/bottom 20% of image (hides pipette walls).
  clahe_clip_limit: 2.0            # Contrast enhancement strength.
  clahe_tile_grid_size: [8, 8]     # Grid size for contrast adjustment.
  canny_low_threshold: 50          # Edge detection sensitivity (Lower limit).
  canny_high_threshold: 150        # Edge detection sensitivity (Upper limit).
  gaussian_kernel_size: [3, 3]     # Blur amount to reduce noise before detection.

kymograph_parameters:
  default_kymograph_width_px: 100  # Width of the generated space-time image.
  default_line_width_px: 10        # Thickness of the slice taken for the kymograph.

plotting_parameters:
  default_dpi: 300                 # Quality of saved plots (300 = Print Quality).
  figure_size_large: [18.0, 12.0]
  figure_size_medium: [10.0, 7.0]

fitting_parameters:
  # Strategy:
  # True = Differential Evolution (Slow, finds best global fit).
  # False = Levenberg-Marquardt (Fast, fine-tunes local fit).
  use_global_optimization: True  

  # Max Attempts: Stop trying to fit after this many calculations. 
  jeffreys_maxfev: 50000           
  empirical_maxfev: 5000       

  # Starting Guess: [Stiffness (E), Viscosity 1 (eta1), Viscosity 2 (eta2)]    
  default_initial_guess: [3000.0, 5000.0, 15000.0]

  # Allowed Ranges: The code will reject results outside these numbers.]
  fitting_bounds:
    E: [100.0, 100000.0]           # [Pa]
    eta1: [100.0, 500000.0]        # [Pa·s]
    eta2: [500.0, 1000000.0]       # [Pa·s]
  
  # Guess Constraints: Limits for the initial random guess generator.
  clipping_bounds_guess:
    E: [500.0, 25000.0]            # [Pa]
    eta1: [1000.0, 50000.0]        # [Pa·s]
    eta2: [5000.0, 100000.0]       # [Pa·s]

validation_parameters:
  # Sanity Check: Warn the user if results fall outside this "Physically Plausible" range.
  plausible_ranges:
    E: [100.0, 50000.0]            # [Pa]
    eta1: [500.0, 100000.0]        # [Pa·s]
    eta2: [1000.0, 200000.0]       # [Pa·s]
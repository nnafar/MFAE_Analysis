# The usual way to run the analysis is with the two scripts in this folder:
#     python run_experiment.py config/my_exp.yaml
#     python run_bulk_analysis.py
# Installing is optional (pip install -e .); it adds the same two commands,
# mfae-experiment and mfae-bulk, usable from any folder.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mfae-analysis"
version = "1.0.0"
description = "Microfluidic aspiration and electroporation (MFAE) of single cells: per-experiment and bulk analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "scipy>=1.14.0",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "opencv-python>=4.10.0",
    "tifffile>=2024.9.20",
    "Pillow>=11.0.0",
    "tqdm>=4.66.5",
    "PyYAML>=6.0.2",
    "pydantic>=2.10.0",
]

[project.optional-dependencies]
czi = ["pylibCZIrw>=4.0.0", "czifile>=2019.7.2"]
dev = ["pytest>=8.0"]

[project.scripts]
mfae-experiment = "mfae.cli:main"
mfae-bulk = "mfae.bulk.run:main"

[tool.setuptools.packages.find]
include = ["mfae*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
